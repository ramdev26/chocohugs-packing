<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Packing Report — Choco Hugs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --surface:    #ffffff;
      --bg:         #f6f6f7;
      --border:     #e1e3e5;
      --text:       #202223;
      --sub:        #6d7175;
      --green:      #008060;
      --green-dk:   #006e52;
      --badge-yes:  #aee9d1;
      --badge-yes-t:#0d3b2e;
      --badge-no:   #f1f2f3;
      --badge-no-t: #6d7175;
      --badge-card: #e4f0ff;
      --badge-card-t:#0051c3;
      --badge-warn: #ffd79d;
      --badge-warn-t:#4b3200;
      --danger:     #d82c0d;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
    }

    /* ── Header ── */
    .top-bar {
      background: #1a1a1a;
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .top-bar .logo { font-size: 22px; }
    .top-bar h1 { color: #fff; font-size: 15px; font-weight: 600; }
    .top-bar .store { color: #aaa; font-size: 13px; margin-left: 4px; }

    /* ── Page ── */
    .page { padding: 20px; max-width: 1400px; margin: 0 auto; }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .card-body  { padding: 16px 20px; }
    .card-body + .card-body { border-top: 1px solid var(--border); }

    /* ── Filters ── */
    .filters { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    .field { display: flex; flex-direction: column; gap: 4px; min-width: 130px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: .04em; }
    .field input,
    .field select {
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      color: var(--text);
      background: var(--surface);
      outline: none;
    }
    .field input:focus,
    .field select:focus { border-color: #8c9196; box-shadow: 0 0 0 3px #e4e5e7; }

    /* ── Buttons ── */
    .btn {
      height: 36px;
      padding: 0 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      white-space: nowrap;
      transition: background .12s, border-color .12s;
    }
    .btn-primary  { background: var(--green);   color: #fff; border-color: var(--green); }
    .btn-primary:hover { background: var(--green-dk); border-color: var(--green-dk); }
    .btn-plain    { background: var(--surface); color: var(--text); border-color: var(--border); }
    .btn-plain:hover { background: var(--bg); }
    .btn[disabled], .btn:disabled { opacity: .45; pointer-events: none; }
    .btn-row { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }

    /* ── Stats ── */
    .stats { display: flex; }
    .stat { flex: 1; padding: 14px 20px; border-right: 1px solid var(--border); }
    .stat:last-child { border-right: none; }
    .stat-val { font-size: 26px; font-weight: 700; }
    .stat-lbl { font-size: 12px; color: var(--sub); margin-top: 2px; }

    /* ── Table bar ── */
    .table-bar {
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
    }
    .table-bar span { font-size: 13px; font-weight: 600; color: var(--sub); }

    /* ── Table ── */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      text-align: left;
      padding: 10px 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--sub);
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafafa; }
    td { padding: 10px 12px; vertical-align: top; }

    .order-num { font-weight: 700; color: var(--green); font-size: 13px; white-space: nowrap; }
    .product-name { font-weight: 600; }
    .text-sub { color: var(--sub); font-size: 12px; }
    td.qty { font-weight: 700; text-align: center; font-size: 15px; }
    .msg { color: var(--sub); font-style: italic; max-width: 180px; font-size: 12px; line-height: 1.4; }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .b-yes     { background: var(--badge-yes);    color: var(--badge-yes-t); }
    .b-no      { background: var(--badge-no);     color: var(--badge-no-t); }
    .b-card    { background: var(--badge-card);   color: var(--badge-card-t); }
    .b-fulfilled   { background: var(--badge-yes);  color: var(--badge-yes-t); }
    .b-unfulfilled { background: var(--badge-warn); color: var(--badge-warn-t); }
    .b-partial     { background: var(--badge-card); color: var(--badge-card-t); }

    /* ── State messages ── */
    .state {
      padding: 48px 20px;
      text-align: center;
      color: var(--sub);
    }
    .state .ico { font-size: 36px; margin-bottom: 10px; }
    .state p { font-size: 14px; }
    .err-txt { color: var(--danger); font-weight: 500; }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .65s linear infinite;
      flex-shrink: 0;
    }

    /* ── Print ── */
    .print-header { display: none; }
    @media print {
      .top-bar, .filters-card, .stats-card, .no-print { display: none !important; }
      body { background: white; font-size: 11px; }
      .card { border: none; margin-bottom: 0; }
      .table-bar span { font-size: 11px; }
      .print-header { display: block; padding: 0 0 10px; font-size: 14px; font-weight: 700; }
      .badge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      thead th { background: #eee !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      tbody tr { page-break-inside: avoid; }
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="top-bar">
  <span class="logo">🍫</span>
  <h1>Packing Report</h1>
  <span class="store">Choco Hugs</span>
</div>

<div class="page">

  <!-- Filters -->
  <div class="card filters-card no-print">
    <div class="card-body">
      <div class="filters">

        <div class="field">
          <label>From</label>
          <input type="date" id="dateFrom">
        </div>

        <div class="field">
          <label>To</label>
          <input type="date" id="dateTo">
        </div>

        <div class="field">
          <label>Fulfilment Status</label>
          <select id="statusSel">
            <option value="unfulfilled">Unfulfilled only</option>
            <option value="any">All orders</option>
            <option value="fulfilled">Fulfilled</option>
            <option value="partial">Partial</option>
          </select>
        </div>

        <div style="padding-bottom:0; align-self:flex-end;">
          <button class="btn btn-primary" id="loadBtn" onclick="loadOrders()">Load Orders</button>
        </div>

        <div class="btn-row">
          <a class="btn btn-plain" id="exportBtn" href="#" onclick="return false;" disabled>
            ⬇&nbsp;Export CSV
          </a>
          <button class="btn btn-plain" id="printBtn" onclick="window.print()" disabled>
            🖨&nbsp;Print
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="card stats-card" id="statsCard" style="display:none;">
    <div class="stats">
      <div class="stat">
        <div class="stat-val" id="sOrders">0</div>
        <div class="stat-lbl">Orders</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="sItems">0</div>
        <div class="stat-lbl">Line Items</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="sCards">0</div>
        <div class="stat-lbl">Greeting Cards</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="sRibbons">0</div>
        <div class="stat-lbl">Ribbon &amp; Bow</div>
      </div>
    </div>
  </div>

  <!-- Table card -->
  <div class="card">
    <div class="table-bar">
      <span id="tableLabel">Select filters and click Load Orders</span>
    </div>
    <div class="print-header" id="printHeader"></div>
    <div class="tbl-wrap" id="tblWrap">
      <div class="state">
        <div class="ico">📦</div>
        <p>Your packing report will appear here.</p>
      </div>
    </div>
  </div>

</div><!-- /page -->

<script>
  /* ── Init dates to today ── */
  const todayISO = new Date().toISOString().slice(0, 10);
  document.getElementById('dateFrom').value = todayISO;
  document.getElementById('dateTo').value   = todayISO;

  let lastParams = null;

  function params() {
    return new URLSearchParams({
      startDate:          document.getElementById('dateFrom').value,
      endDate:            document.getElementById('dateTo').value,
      fulfillmentStatus:  document.getElementById('statusSel').value,
    }).toString();
  }

  async function loadOrders() {
    const loadBtn   = document.getElementById('loadBtn');
    const tblWrap   = document.getElementById('tblWrap');
    const tableLabel = document.getElementById('tableLabel');

    loadBtn.disabled = true;
    loadBtn.innerHTML = '<span class="spin"></span>&nbsp;Loading…';
    tblWrap.innerHTML = '<div class="state"><span class="spin"></span><p style="margin-top:14px">Fetching orders from Shopify…</p></div>';
    document.getElementById('statsCard').style.display = 'none';
    setActionBtns(false);

    lastParams = params();

    try {
      const res  = await fetch('/api/orders?' + lastParams);
      const data = await res.json();

      // Not authenticated — redirect to Shopify OAuth
      if (res.status === 401) {
        tblWrap.innerHTML = `<div class="state">
          <div class="ico">🔐</div>
          <p style="margin-bottom:14px">App not connected to Shopify yet.</p>
          <a href="/auth" class="btn btn-primary" style="text-decoration:none">Connect to Shopify</a>
        </div>`;
        tableLabel.textContent = 'Authentication required';
        return;
      }

      if (!res.ok) throw new Error(data.error || 'Server error');

      const { rows, stats } = data;

      /* Stats */
      document.getElementById('sOrders').textContent  = stats.orderCount;
      document.getElementById('sItems').textContent   = stats.rowCount;
      document.getElementById('sCards').textContent   = stats.withCard;
      document.getElementById('sRibbons').textContent = stats.withRibbon;
      document.getElementById('statsCard').style.display = '';

      if (!rows.length) {
        tableLabel.textContent = 'No orders found';
        tblWrap.innerHTML = '<div class="state"><div class="ico">🔍</div><p>No orders match the selected filters.</p></div>';
        return;
      }

      tableLabel.textContent =
        `${rows.length} line item${rows.length !== 1 ? 's' : ''} across ${stats.orderCount} order${stats.orderCount !== 1 ? 's' : ''}`;

      tblWrap.innerHTML = buildTable(rows);

      /* Print heading */
      const from = document.getElementById('dateFrom').value;
      const to   = document.getElementById('dateTo').value;
      document.getElementById('printHeader').textContent =
        `Packing Report — Choco Hugs | ${fmtDate(from)}${from !== to ? ' – ' + fmtDate(to) : ''}`;

      /* Enable action buttons */
      setActionBtns(true, '/api/export?' + lastParams);

    } catch (e) {
      tableLabel.textContent = 'Error loading orders';
      tblWrap.innerHTML = `<div class="state"><div class="ico">⚠️</div><p class="err-txt">${esc(e.message)}</p></div>`;
    } finally {
      loadBtn.disabled = false;
      loadBtn.innerHTML = 'Load Orders';
    }
  }

  function setActionBtns(enabled, exportUrl) {
    const eb = document.getElementById('exportBtn');
    const pb = document.getElementById('printBtn');
    if (enabled) {
      eb.href = exportUrl;
      eb.removeAttribute('disabled');
      eb.onclick = null;
      pb.removeAttribute('disabled');
    } else {
      eb.setAttribute('disabled', true);
      eb.onclick = () => false;
      pb.setAttribute('disabled', true);
    }
  }

  function buildTable(rows) {
    const cols = [
      { key: 'Order Number',       th: 'Order #'         },
      { key: 'Order Date',         th: 'Date'            },
      { key: 'Customer',           th: 'Customer'        },
      { key: 'Product Name',       th: 'Product'         },
      { key: 'Quantity',           th: 'Qty'             },
      { key: 'Greeting Card',      th: 'Greeting Card'   },
      { key: 'Ribbon & Bow',       th: 'Ribbon &amp; Bow'},
      { key: 'Personal Message',   th: 'Message / Note'  },
      { key: 'Fulfillment Status', th: 'Status'          },
    ];

    const head = `<thead><tr>${cols.map(c => `<th>${c.th}</th>`).join('')}</tr></thead>`;

    const body = rows.map(row => {
      const cells = cols.map(({ key }) => {
        const v = row[key] ?? '';
        switch (key) {

          case 'Order Number':
            return `<td><span class="order-num">${esc(v)}</span></td>`;

          case 'Product Name': {
            const variant = row['Variant'] ? `<div class="text-sub">${esc(row['Variant'])}</div>` : '';
            const sku     = row['SKU']     ? `<div class="text-sub">SKU: ${esc(row['SKU'])}</div>` : '';
            return `<td><div class="product-name">${esc(v)}</div>${variant}${sku}</td>`;
          }

          case 'Quantity':
            return `<td class="qty">${esc(String(v))}</td>`;

          case 'Greeting Card':
            return v === 'None'
              ? `<td><span class="badge b-no">None</span></td>`
              : `<td><span class="badge b-card">${esc(v)}</span></td>`;

          case 'Ribbon & Bow':
            return v === 'Yes'
              ? `<td><span class="badge b-yes">✓ Yes</span></td>`
              : `<td><span class="badge b-no">No</span></td>`;

          case 'Personal Message':
            return v
              ? `<td><span class="msg">"${esc(v)}"</span></td>`
              : `<td><span style="color:var(--border)">—</span></td>`;

          case 'Fulfillment Status': {
            const cls = { fulfilled: 'b-fulfilled', unfulfilled: 'b-unfulfilled', partial: 'b-partial' }[v] || 'b-no';
            return `<td><span class="badge ${cls}">${esc(v.charAt(0).toUpperCase() + v.slice(1))}</span></td>`;
          }

          default:
            return `<td>${esc(String(v))}</td>`;
        }
      }).join('');
      return `<tr>${cells}</tr>`;
    }).join('');

    return `<table>${head}<tbody>${body}</tbody></table>`;
  }

  function fmtDate(iso) {
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
